apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-alert-deployment
  namespace: healthsafe
spec:
  replicas: 1

  selector:
    matchLabels:
      app: equipment-alert-service

  template:
    metadata:
      labels:
        app: equipment-alert-service

    spec:
      containers:
        - name: equipment-alert-service
          image: healthsafe-equipment-alert:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 7034

          env:
            - name: ACTIVEMQ_BROKER_URL
              value: "tcp://activemq:61616"

          readinessProbe:
            httpGet:
              path: /health
              port: 7034
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 7034
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: equipment-alert-service
  namespace: healthsafe
spec:
  selector:
    app: equipment-alert-service

  ports:
    - port: 7034
      targetPort: 7034

  type: ClusterIP