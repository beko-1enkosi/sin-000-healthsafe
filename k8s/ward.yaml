apiVersion: apps/v1
kind: Deployment
metadata:
  name: ward-deployment
  namespace: healthsafe
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ward-service

  template:
    metadata:
      labels:
        app: ward-service

    spec:
      containers:
        - name: ward-service
          image: healthsafe-ward:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 7031

          env:
            - name: INGESTION_SERVICE_URL
              value: "http://ingestion-service:7030"

            - name: ACTIVEMQ_BROKER_URL
              value: "tcp://activemq:61616"

          readinessProbe:
            httpGet:
              path: /health
              port: 7031
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 7031
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ward-service
  namespace: healthsafe
spec:
  selector:
    app: ward-service

  ports:
    - port: 7031
      targetPort: 7031

  type: ClusterIP