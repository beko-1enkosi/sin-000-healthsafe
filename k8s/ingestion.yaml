apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-deployment
  namespace: healthsafe
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ingestion-service

  template:
    metadata:
      labels:
        app: ingestion-service

    spec:
      containers:
        - name: ingestion-service
          image: healthsafe-ingestion:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 7030

          readinessProbe:
            httpGet:
              path: /health
              port: 7030
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 7030
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: healthsafe
spec:
  selector:
    app: ingestion-service

  ports:
    - port: 7030
      targetPort: 7030

  type: ClusterIP