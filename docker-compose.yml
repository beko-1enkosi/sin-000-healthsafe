services:
  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ingestion-service:
    build:
      context: ./ingestion-service
    image: healthsafe-ingestion
    ports:
      - "7030:7030"

  alert-level-service:
    build:
      context: ./alert-level-service
    image: healthsafe-alert-level
    ports:
      - "7032:7032"

  ward-service:
    build:
      context: ./ward-service
    image: healthsafe-ward
    ports:
      - "7031:7031"
    environment:
      INGESTION_SERVICE_URL: http://ingestion-service:7030
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_healthy
      ingestion-service:
        condition: service_started

  staffing-service:
    build:
      context: ./staffing-service
    image: healthsafe-staffing
    ports:
      - "7033:7033"
    environment:
      WARD_SERVICE_URL: http://ward-service:7031
      ALERT_LEVEL_SERVICE_URL: http://alert-level-service:7032
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_healthy
      ward-service:
        condition: service_started
      alert-level-service:
        condition: service_started

  equipment-alert-service:
    build:
      context: ./equipment-alert-service
    image: healthsafe-equipment-alert
    ports:
      - "7034:7034"
    environment:
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_healthy